name: Expo Web Build Test

on:
  push:
    branches:
      - main # Kodlarını main branch'ine attığında çalışır

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Kodları Çek
        uses: actions/checkout@v4

      - name: 2. Node.js Kur (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Bağımlılıkları Yükle
        run: npm install

      - name: 4. Web Build Al (Expo Export)
        # Bu komut package.json'daki "build": "npx expo export" kısmını çalıştırır
        run: npm run build

      - name: 5. Çıktıyı GitHub'a Yükle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: expo-web-build-cikti
          path: dist/ # Expo export komutu dosyaları buraya çıkarır
          retention-days: 7

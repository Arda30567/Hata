name: Build and Package Only

on:
  push:
    branches:
      - main

jobs:
  build-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 18 yerine 20 yaptık, uyarılar gidecek

      - name: Install Dependencies
        run: npm install

      # Eğer hala "Missing script build" hatası alıyorsan, 
      # bu adımı geçici olarak kapatabiliriz (başına # koyarak).
      - name: Install and Build
        run: npm run build 

      - name: Upload Build Result
        uses: actions/upload-artifact@v4
        with:
          name: sitemin-cikti-dosyasi
          path: dist/ # Burayı kontrol et! dist mi, build mi yoksa sadece . mi?
